name: Debug captured CFF regression

on:
  push:
    branches:
      - feature/jsconfuser-cff-shared-wrapper-helpers
    paths:
      - .github/workflows/debug-cff-regression.yml

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/jsconfuser-cff-shared-wrapper-helpers
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - name: Instrument twice recognizer in runner only
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/passes/jsconfuser/cff/bodyTwice213.ts')
          text = path.read_text()
          replacements = {
            '  if (models.length !== 1) return null;': '  if (models.length !== 1) { console.error("TWICE_FAIL models", models.length); return null; }',
            '  if (!wrapper || !add3) return null;': '  if (!wrapper || !add3) { console.error("TWICE_FAIL wrappers", { wrapper: Boolean(wrapper), add3: Boolean(add3), wrappers }); return null; }',
            '  if (!wrapperAssignment) return null;': '  if (!wrapperAssignment) { console.error("TWICE_FAIL wrapperAssignment", wrapper); return null; }',
            '  if (!privateScope) return null;': '  if (!privateScope) { console.error("TWICE_FAIL privateScope", wrapper); return null; }',
            '  if (!input) return null;': '  if (!input) { console.error("TWICE_FAIL input", { wrapper, privateScope }); return null; }',
            '  if (!nested) return null;': '  if (!nested) { console.error("TWICE_FAIL nested", { wrapper, privateScope, input }); return null; }',
            '  return matchedSwitches === 1;': '  console.error("TWICE_SEMANTIC matchedSwitches", matchedSwitches);\n  return matchedSwitches === 1;',
            '    if (callMatch && parityMatch && doubleReturn && plusReturn) matchedSwitches += 1;': '    console.error("TWICE_SWITCH", { innerPath, resultPath, callMatch, parityMatch, doubleReturn, plusReturn, returnCandidates });\n    if (callMatch && parityMatch && doubleReturn && plusReturn) matchedSwitches += 1;',
            '          const right = evaluateInner(expression.right, model, invocationStates, innerPath, innerStates);': '          const right = evaluateInner(expression.right, model, invocationStates, innerPath, innerStates);\n          console.error("TWICE_RETURN_EVAL", { right, outer: evaluateOuter(expression.right, model, invocationStates), innerPath, expression: JSON.stringify(expression.right) });',
            '    visitNodes(node, (candidate) => {\n      if (\n        candidate.type === "AssignmentExpression" &&': '    visitNodes(node, (candidate) => {\n      if (candidate.type === "AssignmentExpression" && candidate.left.type === "MemberExpression" && candidate.left.computed && candidate.left.property.type !== "PrivateName") {\n        const writePath = staticMemberPath(candidate.left.object, model.scopeName);\n        const writeIndex = evaluateInner(candidate.left.property, model, invocationStates, innerPath, innerStates);\n        if (writePath && pathsEqual(writePath, innerPath) && writeIndex === 75) {\n          console.error("TWICE_SLOT75_WRITE", { right: JSON.stringify(candidate.right), evaluatedWithEntry: evaluateInner(candidate.right, model, invocationStates, innerPath, innerStates) });\n        }\n      }\n      if (\n        candidate.type === "AssignmentExpression" &&',
          }
          for old, new in replacements.items():
            if old not in text:
              raise SystemExit(f'missing instrumentation target: {old}')
            text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - run: npm test -- --run test/transforms/control-flow-flattening-regression.test.ts

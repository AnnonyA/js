name: Debug second CFF regression

on:
  push:
    branches:
      - feature/jsconfuser-cff-shared-wrapper-helpers
    paths:
      - .github/workflows/debug-cff-regression.yml

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/jsconfuser-cff-shared-wrapper-helpers
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - name: Instrument add3 recognizer in runner only
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/passes/jsconfuser/cff/body213.ts')
          text = path.read_text()
          probes = [
            ('if (models.length !== 1) return null;', 'if (models.length !== 1) { console.error("ADD3_FAIL models", models.length); return null; }'),
            ('if (!wrapper) return null;', 'if (!wrapper) { console.error("ADD3_FAIL wrapper"); return null; }'),
            ('if (!wrapperAssignment) return null;', 'if (!wrapperAssignment) { console.error("ADD3_FAIL assignment", wrapper); return null; }'),
            ('if (!privateScope) return null;', 'if (!privateScope) { console.error("ADD3_FAIL privateScope", wrapper); return null; }'),
            ('if (!parameterSlots || new Set(parameterSlots).size !== 3) return null;', 'if (!parameterSlots || new Set(parameterSlots).size !== 3) { console.error("ADD3_FAIL parameterSlots", { parameterSlots, wrapper, privateScope }); return null; }'),
            ('if (!nested) return null;', 'if (!nested) { console.error("ADD3_FAIL nested", { wrapper, privateScope, parameterSlots }); return null; }'),
            ('if (!body || body.consoleProperty !== "log") return null;', 'if (!body || body.consoleProperty !== "log") { console.error("ADD3_FAIL body", { body, wrapper, privateScope, parameterSlots, nested }); return null; }'),
          ]
          start = text.index('function findAdd3Pattern(')
          prefix = text[:start]
          suffix = text[start:]
          for old, new in probes:
            if old not in suffix:
              raise SystemExit(f'missing add3 probe target: {old}')
            suffix = suffix.replace(old, new, 1)
          path.write_text(prefix + suffix)
          PY
      - run: npm test -- --run test/transforms/control-flow-flattening-regression2.test.ts

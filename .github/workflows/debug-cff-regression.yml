name: Debug case-sensitive inner CFF tracer

on:
  push:
    branches:
      - feature/jsconfuser-cff-shared-wrapper-helpers
    paths:
      - .github/workflows/debug-cff-regression.yml

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/jsconfuser-cff-shared-wrapper-helpers
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - name: Apply staged fix in runner
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/fix-inner-cff-state.yml').read_text()
          start_token = "          python - <<'PY'\n"
          end_token = "\n          PY\n"
          start = workflow.index(start_token) + len(start_token)
          end = workflow.index(end_token, start)
          lines = workflow[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines) + "\n"
          Path('/tmp/fix_inner_cff_state.py').write_text(script)
          PY
          python /tmp/fix_inner_cff_state.py
      - name: Instrument patched twice recognizer
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/passes/jsconfuser/cff/bodyTwice213.ts')
          text = path.read_text()
          replacements = {
            '    if (!traces) return;': '    if (!traces) { console.error("TRACE_NULL", innerPath); return; }\n    console.error("TRACE_COUNT", innerPath, traces.length);',
            '            if (path && typeof right === "number") {': '            console.error("TRACE_RETURN", { innerPath, slot75: currentStates[75], right, operator: expression.operator, statesSum: currentStates.reduce((a, b) => a + b, 0) });\n            if (path && typeof right === "number") {',
            '    if (callMatch && parityMatch && doubleReturn && plusReturn) matchedSwitches += 1;': '    console.error("TRACE_MATCH", { innerPath, callMatch, parityMatch, doubleReturn, plusReturn, returnCandidates });\n    if (callMatch && parityMatch && doubleReturn && plusReturn) matchedSwitches += 1;',
          }
          for old, new in replacements.items():
            if old not in text:
              raise SystemExit(f'missing target: {old}')
            text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - run: npm test -- --run test/transforms/control-flow-flattening-regression.test.ts

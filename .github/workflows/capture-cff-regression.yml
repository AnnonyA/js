name: Capture second randomized CFF regression

on:
  push:
    branches:
      - feature/jsconfuser-cff-shared-wrapper-helpers
    paths:
      - .github/workflows/capture-cff-regression.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/jsconfuser-cff-shared-wrapper-helpers
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Capture next failing fresh CFF sample
        run: |
          node --input-type=module <<'NODE'
          import { mkdir, readFile, writeFile } from 'node:fs/promises';
          import { resolve } from 'node:path';
          import { obfuscate } from 'js-confuser';
          import { decompile } from './dist/index.js';

          const source = await readFile(
            resolve('test/fixtures/2.1.3/controlFlowFlattening/source.js'),
            'utf8',
          );
          const expected = ['add3', 'scenario', 'twice'];
          const directory = resolve('test/fixtures/2.1.3/controlFlowFlattening-regression2');
          await mkdir(directory, { recursive: true });

          let captured = false;
          for (let attempt = 1; attempt <= 50; attempt += 1) {
            const obfuscated = await obfuscate(source, {
              target: 'node',
              compact: true,
              controlFlowFlattening: true,
              renameGlobals: false,
              renameLabels: false,
            });
            const result = await decompile(obfuscated.code);
            const bodies = (result.report.recovery.cffBodies ?? [])
              .filter((item) => item && typeof item === 'object')
              .map((item) => item.exportName)
              .filter((name) => typeof name === 'string')
              .sort();
            if (JSON.stringify(bodies) === JSON.stringify(expected)) continue;

            const metadata = {
              attempt,
              bodies,
              wrappers: result.report.recovery.cffWrappers ?? [],
              recoveryKeys: Object.keys(result.report.recovery).sort(),
              warnings: result.report.warnings ?? [],
            };
            await writeFile(resolve(directory, 'obfuscated.js'), obfuscated.code + '\n', 'utf8');
            await writeFile(
              resolve(directory, 'metadata.json'),
              JSON.stringify(metadata, null, 2) + '\n',
              'utf8',
            );
            console.log('Captured failing attempt', attempt);
            console.log(JSON.stringify(metadata));
            captured = true;
            break;
          }

          if (!captured) throw new Error('No second failing CFF sample found in 50 attempts');
          NODE
      - name: Commit regression fixture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/fixtures/2.1.3/controlFlowFlattening-regression2/obfuscated.js test/fixtures/2.1.3/controlFlowFlattening-regression2/metadata.json
          git commit -m "test: capture second CFF randomized regression fixture"
          git push origin HEAD:feature/jsconfuser-cff-shared-wrapper-helpers

name: CI

on:
  push:
    branches: ["feature/jsconfuser-decompiler"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - run: npm install
      - run: npm test -- --run
      - run: npm run typecheck
      - run: npm run build

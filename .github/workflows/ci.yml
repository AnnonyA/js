name: CI

on:
  push:
    branches: ["feature/jsconfuser-decompiler"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
      - run: npm ci
      - name: Generate missing 2.1.3 golden fixtures
        if: github.event_name == 'push'
        run: |
          if [ ! -f test/fixtures/2.1.3/renameVariables/obfuscated.js ]; then
            rm -rf .fixture-build
            npx tsc scripts/generate-213-fixtures.ts test/helpers/jsconfuser213.ts \
              --ignoreConfig \
              --target ES2022 \
              --module NodeNext \
              --moduleResolution NodeNext \
              --esModuleInterop \
              --skipLibCheck \
              --types node \
              --outDir .fixture-build
            node .fixture-build/scripts/generate-213-fixtures.js
            rm -rf .fixture-build
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add test/fixtures/2.1.3
            git commit -m "test: add js-confuser 2.1.3 golden fixtures"
            git push
          fi
      - run: npm test -- --run
      - run: npm run typecheck
      - run: npm run build
      - run: git diff --check

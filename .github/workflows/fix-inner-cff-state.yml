name: Verify inner CFF state tracing

on:
  push:
    branches:
      - feature/jsconfuser-cff-shared-wrapper-helpers
    paths:
      - .github/workflows/fix-inner-cff-state.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/jsconfuser-cff-shared-wrapper-helpers
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Verify captured regression
        run: npm test -- --run test/transforms/control-flow-flattening-regression.test.ts
      - name: Stress fresh 2.1.3 CFF randomizations
        run: |
          for i in $(seq 1 10); do
            echo "=== randomized run $i/10 ==="
            npm test -- --run test/transforms/control-flow-flattening-randomized.test.ts
          done
      - name: Run full suite
        run: npm test -- --run
      - run: git diff --check

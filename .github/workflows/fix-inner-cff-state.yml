name: Fix case-sensitive inner CFF tracing

on:
  push:
    branches:
      - feature/jsconfuser-cff-shared-wrapper-helpers
    paths:
      - .github/workflows/fix-inner-cff-state.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/jsconfuser-cff-shared-wrapper-helpers
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - name: Add inner CFF state tracer and migrate twice recognizer
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime = Path('src/passes/jsconfuser/cff/runtime213.ts')
          text = runtime.read_text()
          marker = 'export function selectedCaseIndex(model: Cff213Model, states: readonly number[]): number | null {'
          if marker not in text:
            raise SystemExit('runtime insertion marker missing')
          if 'export function traceInnerSwitchCases(' in text:
            raise SystemExit('inner tracer already present')

          addition = r'''export interface InnerSwitchCaseTrace {
  switchCase: t.SwitchCase;
  states: number[];
}

function innerStateIndex(
  node: t.Node,
  model: Cff213Model,
  outerStates: readonly number[],
  innerPath: readonly string[],
  innerStates: readonly number[],
): number | null {
  if (node.type !== "MemberExpression" || !node.computed || node.property.type === "PrivateName") {
    return null;
  }
  const path = staticMemberPath(node.object, model.scopeName);
  if (!path || !pathsEqual(path, innerPath)) return null;
  const value = evaluateInner(node.property, model, outerStates, innerPath, innerStates);
  return typeof value === "number" && Number.isInteger(value) && value >= 0 && value < innerStates.length
    ? value
    : null;
}

function applyInnerStateAssignment(
  expression: t.AssignmentExpression,
  model: Cff213Model,
  outerStates: readonly number[],
  innerPath: readonly string[],
  innerStates: number[],
): boolean {
  const index = innerStateIndex(expression.left, model, outerStates, innerPath, innerStates);
  if (index === null) return true;
  const right = evaluateInner(expression.right, model, outerStates, innerPath, innerStates);
  if (typeof right !== "number") return false;
  const current = innerStates[index]!;
  switch (expression.operator) {
    case "=": innerStates[index] = right; break;
    case "+=": innerStates[index] = current + right; break;
    case "-=": innerStates[index] = current - right; break;
    case "*=": innerStates[index] = current * right; break;
    case "/=": innerStates[index] = current / right; break;
    case "%=": innerStates[index] = current % right; break;
    case "^=": innerStates[index] = current ^ right; break;
    case "|=": innerStates[index] = current | right; break;
    case "&=": innerStates[index] = current & right; break;
    case "<<=": innerStates[index] = current << right; break;
    case ">>=": innerStates[index] = current >> right; break;
    case ">>>=": innerStates[index] = current >>> right; break;
    default: return false;
  }
  return true;
}

export function applyInnerStateExpression(
  expression: t.Expression,
  model: Cff213Model,
  outerStates: readonly number[],
  innerPath: readonly string[],
  innerStates: number[],
): boolean {
  if (expression.type === "SequenceExpression") {
    for (const item of expression.expressions) {
      if (!applyInnerStateExpression(item, model, outerStates, innerPath, innerStates)) return false;
    }
    return true;
  }
  if (expression.type === "AssignmentExpression") {
    return applyInnerStateAssignment(expression, model, outerStates, innerPath, innerStates);
  }
  if (expression.type === "UpdateExpression") {
    const index = innerStateIndex(expression.argument, model, outerStates, innerPath, innerStates);
    if (index !== null) {
      innerStates[index] = innerStates[index]! + (expression.operator === "++" ? 1 : -1);
    }
  }
  return true;
}

export function selectedInnerCaseIndex(
  switchStatement: t.SwitchStatement,
  model: Cff213Model,
  outerStates: readonly number[],
  innerPath: readonly string[],
  innerStates: readonly number[],
): number | null {
  const discriminant = evaluateInner(
    switchStatement.discriminant,
    model,
    outerStates,
    innerPath,
    innerStates,
  );
  if (discriminant === UNKNOWN) return null;
  let defaultIndex: number | null = null;
  for (let index = 0; index < switchStatement.cases.length; index += 1) {
    const switchCase = switchStatement.cases[index]!;
    if (!switchCase.test) {
      defaultIndex = index;
      continue;
    }
    const test = evaluateInner(switchCase.test, model, outerStates, innerPath, innerStates);
    if (test !== UNKNOWN && test === discriminant) return index;
  }
  return defaultIndex;
}

type InnerFlowControl = "continue" | "repeat" | "terminal";
interface InnerFlowState {
  states: number[];
  control: InnerFlowControl;
}

function executeInnerStatements(
  statements: readonly t.Statement[],
  model: Cff213Model,
  outerStates: readonly number[],
  innerPath: readonly string[],
  initialStates: readonly number[],
): InnerFlowState[] | null {
  let flows: InnerFlowState[] = [{ states: [...initialStates], control: "continue" }];
  for (const statement of statements) {
    const next: InnerFlowState[] = [];
    for (const flow of flows) {
      if (flow.control !== "continue") {
        next.push(flow);
        continue;
      }
      if (statement.type === "ExpressionStatement") {
        const states = [...flow.states];
        if (!applyInnerStateExpression(statement.expression, model, outerStates, innerPath, states)) return null;
        next.push({ states, control: "continue" });
        continue;
      }
      if (statement.type === "BreakStatement" || statement.type === "ContinueStatement") {
        next.push({ states: [...flow.states], control: "repeat" });
        continue;
      }
      if (statement.type === "ReturnStatement" || statement.type === "ThrowStatement") {
        next.push({ states: [...flow.states], control: "terminal" });
        continue;
      }
      if (statement.type === "BlockStatement") {
        const nested = executeInnerStatements(statement.body, model, outerStates, innerPath, flow.states);
        if (!nested) return null;
        next.push(...nested);
        continue;
      }
      if (statement.type === "IfStatement") {
        const test = evaluateInner(statement.test, model, outerStates, innerPath, flow.states);
        const branches: Array<t.Statement | null> = test === UNKNOWN
          ? [statement.consequent, statement.alternate]
          : [test ? statement.consequent : statement.alternate];
        for (const branch of branches) {
          if (!branch) {
            next.push({ states: [...flow.states], control: "continue" });
            continue;
          }
          const branchStatements = branch.type === "BlockStatement" ? branch.body : [branch];
          const nested = executeInnerStatements(branchStatements, model, outerStates, innerPath, flow.states);
          if (!nested) return null;
          next.push(...nested);
        }
        continue;
      }
      next.push({ states: [...flow.states], control: "continue" });
    }
    flows = next;
  }
  return flows;
}

export function traceInnerSwitchCases(
  switchStatement: t.SwitchStatement,
  model: Cff213Model,
  outerStates: readonly number[],
  innerPath: readonly string[],
  initialInnerStates: readonly number[],
  maxSteps = 96,
): InnerSwitchCaseTrace[] | null {
  const traces: InnerSwitchCaseTrace[] = [];
  const queue: number[][] = [[...initialInnerStates]];
  const seen = new Set<string>();

  for (let step = 0; queue.length > 0 && step < maxSteps; step += 1) {
    const states = queue.shift()!;
    const signature = states.join(",");
    if (seen.has(signature)) continue;
    seen.add(signature);
    const selected = selectedInnerCaseIndex(switchStatement, model, outerStates, innerPath, states);
    if (selected === null) return null;

    let active: InnerFlowState[] = [{ states: [...states], control: "continue" }];
    for (let cursor = selected; cursor < switchStatement.cases.length; cursor += 1) {
      const switchCase = switchStatement.cases[cursor]!;
      for (const flow of active) {
        if (flow.control === "continue") {
          traces.push({ switchCase, states: [...flow.states] });
        }
      }
      const continued: InnerFlowState[] = [];
      for (const flow of active) {
        if (flow.control !== "continue") {
          continued.push(flow);
          continue;
        }
        const executed = executeInnerStatements(
          switchCase.consequent,
          model,
          outerStates,
          innerPath,
          flow.states,
        );
        if (!executed) return null;
        continued.push(...executed);
      }
      for (const flow of continued) {
        if (flow.control === "repeat") queue.push([...flow.states]);
      }
      active = continued.filter((flow) => flow.control === "continue");
      if (active.length === 0) break;
    }
  }

  if (queue.length > 0) return null;
  return traces;
}

'''
          text = text.replace(marker, addition + marker, 1)
          runtime.write_text(text)

          body = Path('src/passes/jsconfuser/cff/bodyTwice213.ts')
          text = body.read_text()
          old_import = '  staticMemberPath,\n  visitNodes,\n} from "./runtime213.js";'
          new_import = '  staticMemberPath,\n  traceInnerSwitchCases,\n  visitNodes,\n} from "./runtime213.js";'
          if old_import not in text:
            raise SystemExit('twice runtime import marker missing')
          text = text.replace(old_import, new_import, 1)

          start = text.index('function findTwiceSemanticSwitch(')
          end = text.index('function findTwicePattern(', start)
          replacement = r'''function findTwiceSemanticSwitch(
  model: Cff213Model,
  invocationStates: readonly number[],
  innerStates: readonly number[],
  privateScope: string,
  inputSlotName: string,
  add3Path: readonly string[],
): boolean {
  let matchedSwitches = 0;
  visitNodes(model.switchStatement, (node) => {
    if (node.type !== "SwitchStatement" || node === model.switchStatement) return;
    const innerPath = innerSwitchPath(node, model);
    if (!innerPath) return;
    const traces = traceInnerSwitchCases(node, model, invocationStates, innerPath, innerStates);
    if (!traces) return;

    const inputPath = [privateScope, inputSlotName];
    let resultPath: string[] | null = null;
    let callMatch = false;
    let parityMatch = false;
    const returnCandidates: Array<{
      path: string[];
      operator: "*" | "+";
      right: number;
    }> = [];

    for (const trace of traces) {
      const currentStates = trace.states;
      const inner = { path: innerPath, states: currentStates };
      visitNodes(t.blockStatement(trace.switchCase.consequent), (candidate) => {
        if (
          candidate.type === "AssignmentExpression" &&
          candidate.operator === "=" &&
          candidate.left.type === "MemberExpression" &&
          candidate.right.type === "CallExpression"
        ) {
          const calleePath = callPath(candidate.right, model, invocationStates);
          if (calleePath && pathsEqual(calleePath, add3Path) && candidate.right.arguments.length === 3) {
            const [first, second, third] = candidate.right.arguments;
            if (
              first && second && third &&
              first.type !== "SpreadElement" && second.type !== "SpreadElement" && third.type !== "SpreadElement"
            ) {
              const firstPath = dynamicMemberPath(first, model, invocationStates, inner);
              const secondPath = dynamicMemberPath(second, model, invocationStates, inner);
              const zero = evaluateInner(third, model, invocationStates, innerPath, currentStates);
              const targetPath = dynamicMemberPath(candidate.left, model, invocationStates, inner);
              if (
                firstPath && secondPath && targetPath &&
                pathsEqual(firstPath, inputPath) &&
                pathsEqual(secondPath, inputPath) &&
                zero === 0
              ) {
                resultPath = targetPath;
                callMatch = true;
              }
            }
          }
        }

        if (candidate.type === "IfStatement" && candidate.test.type === "BinaryExpression") {
          const test = candidate.test;
          if (
            (test.operator === "===" || test.operator === "==") &&
            t.isExpression(test.left) &&
            t.isExpression(test.right) &&
            test.left.type === "BinaryExpression" &&
            test.left.operator === "%" &&
            t.isExpression(test.left.left) &&
            t.isExpression(test.left.right)
          ) {
            const path = dynamicMemberPath(test.left.left, model, invocationStates, inner);
            const modulo = evaluateInner(test.left.right, model, invocationStates, innerPath, currentStates);
            const zero = evaluateInner(test.right, model, invocationStates, innerPath, currentStates);
            if (path && resultPath && pathsEqual(path, resultPath) && modulo === 2 && zero === 0) {
              parityMatch = true;
            }
          }
        }

        if (candidate.type === "ReturnStatement" && candidate.argument && t.isExpression(candidate.argument)) {
          const expression = tailExpression(candidate.argument);
          if (
            expression.type === "BinaryExpression" &&
            (expression.operator === "*" || expression.operator === "+") &&
            t.isExpression(expression.left) &&
            t.isExpression(expression.right)
          ) {
            const path = dynamicMemberPath(expression.left, model, invocationStates, inner);
            const right = evaluateInner(expression.right, model, invocationStates, innerPath, currentStates);
            if (path && typeof right === "number") {
              returnCandidates.push({ path, operator: expression.operator, right });
            }
          }
        }
      });
    }

    const doubleReturn = Boolean(resultPath) && returnCandidates.some(
      (candidate) =>
        candidate.operator === "*" &&
        candidate.right === 2 &&
        pathsEqual(candidate.path, resultPath!),
    );
    const plusReturn = Boolean(resultPath) && returnCandidates.some(
      (candidate) =>
        candidate.operator === "+" &&
        candidate.right === 1 &&
        pathsEqual(candidate.path, resultPath!),
    );

    if (callMatch && parityMatch && doubleReturn && plusReturn) matchedSwitches += 1;
  });
  return matchedSwitches === 1;
}

'''
          text = text[:start] + replacement + text[end:]
          body.write_text(text)
          PY
      - name: Verify deterministic RED turns green
        run: npm test -- --run test/transforms/control-flow-flattening-regression.test.ts
      - run: npm run typecheck
      - run: npm run build
      - run: npm test -- --run
      - run: git diff --check
      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/passes/jsconfuser/cff/runtime213.ts src/passes/jsconfuser/cff/bodyTwice213.ts
          git commit -m "fix: trace inner CFF state per case"
          git push origin HEAD:feature/jsconfuser-cff-shared-wrapper-helpers

name: Refactor shared CFF runtime

on:
  push:
    branches:
      - feature/jsconfuser-cff-shared-runtime
    paths:
      - .github/workflows/refactor-cff-runtime.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/jsconfuser-cff-shared-runtime
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - name: Migrate CFF body passes to runtime213
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { parse } = require('@babel/parser');

          const files = [
            'src/passes/jsconfuser/cff/body213.ts',
            'src/passes/jsconfuser/cff/bodyTwice213.ts',
            'src/passes/jsconfuser/cff/bodyScenario213.ts',
          ];
          const sharedFunctions = new Set([
            'visitNodes',
            'pathsEqual',
            'staticMemberPath',
            'stateIndex',
            'evaluateBinary',
            'evaluateOuter',
            'evaluateInner',
            'decodeXor',
            'dynamicMemberPath',
            'selectedCaseIndex',
            'applyStateAssignment',
            'applyStateExpression',
            'expandRuntimeStateArray',
          ]);
          const importBlock = `import {\n  UNKNOWN,\n  applyStateExpression,\n  decodeXor,\n  dynamicMemberPath,\n  evaluateInner,\n  evaluateOuter,\n  expandRuntimeStateArray,\n  pathsEqual,\n  selectedCaseIndex,\n  staticMemberPath,\n  visitNodes,\n} from "./runtime213.js";\n`;

          function parseTs(text) {
            return parse(text, {
              sourceType: 'module',
              plugins: ['typescript'],
            }).program;
          }

          for (const file of files) {
            let text = fs.readFileSync(file, 'utf8');
            const source = parseTs(text);
            const removals = [];

            for (const statement of source.body) {
              if (
                statement.type === 'FunctionDeclaration' &&
                statement.id &&
                sharedFunctions.has(statement.id.name)
              ) {
                removals.push([statement.start, statement.end]);
                continue;
              }
              if (statement.type === 'TSTypeAliasDeclaration' && statement.id.name === 'Value') {
                removals.push([statement.start, statement.end]);
                continue;
              }
              if (statement.type === 'VariableDeclaration') {
                const names = statement.declarations.map((decl) =>
                  decl.id.type === 'Identifier' ? decl.id.name : null,
                );
                if (names.includes('UNKNOWN')) removals.push([statement.start, statement.end]);
              }
            }

            if (removals.length < 10) {
              throw new Error(`${file}: expected shared helper duplication, found only ${removals.length} removable declarations`);
            }

            removals.sort((a, b) => b[0] - a[0]);
            for (const [start, end] of removals) {
              text = text.slice(0, start) + text.slice(end);
            }

            const reparsed = parseTs(text);
            let insertAt = 0;
            for (const statement of reparsed.body) {
              if (statement.type === 'ImportDeclaration') insertAt = statement.end;
              else break;
            }
            if (!text.includes('from "./runtime213.js"')) {
              text = text.slice(0, insertAt) + '\n' + importBlock + text.slice(insertAt);
            }
            text = text.replace(/\n{3,}/g, '\n\n');
            fs.writeFileSync(file, text.endsWith('\n') ? text : text + '\n');
          }
          NODE
      - run: npm run typecheck
      - run: npm run build
      - run: npm test -- --run
      - run: git diff --check
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/passes/jsconfuser/cff/body213.ts src/passes/jsconfuser/cff/bodyTwice213.ts src/passes/jsconfuser/cff/bodyScenario213.ts
          git commit -m "refactor: share 2.1.3 CFF runtime helpers"
          git push origin HEAD:feature/jsconfuser-cff-shared-runtime

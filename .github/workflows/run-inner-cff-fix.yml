name: Run inner CFF fix

on:
  push:
    branches:
      - feature/jsconfuser-cff-shared-wrapper-helpers
    paths:
      - .github/workflows/run-inner-cff-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/jsconfuser-cff-shared-wrapper-helpers
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - name: Extract and run staged patch
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/fix-inner-cff-state.yml').read_text()
          start_token = "          python - <<'PY'\n"
          end_token = "\n          PY\n"
          start = workflow.index(start_token) + len(start_token)
          end = workflow.index(end_token, start)
          lines = workflow[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines) + "\n"
          Path('/tmp/fix_inner_cff_state.py').write_text(script)
          PY
          python /tmp/fix_inner_cff_state.py
      - name: Complete inner CFF evaluator support
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/passes/jsconfuser/cff/runtime213.ts')
          text = path.read_text()
          function_start = text.index('export function evaluateInner(')
          marker = '  if (node.type === "UnaryExpression") {'
          insert_at = text.index(marker, function_start)
          addition = '''  if (\n    node.type === "CallExpression" &&\n    node.callee.type === "Identifier" &&\n    node.callee.name === model.sumName &&\n    node.arguments.length === 1\n  ) {\n    const argument = node.arguments[0];\n    if (argument && argument.type !== "SpreadElement" && t.isNode(argument)) {\n      const path = staticMemberPath(argument, model.scopeName);\n      if (path && pathsEqual(path, innerPath)) {\n        return innerStates.reduce((sum, value) => sum + value, 0);\n      }\n    }\n  }\n'''
          text = text[:insert_at] + addition + text[insert_at:]
          old = 'const branches: Array<t.Statement | null> = test === UNKNOWN'
          new = 'const branches: Array<t.Statement | null | undefined> = test === UNKNOWN'
          if old not in text:
            raise SystemExit('inner branch type marker missing')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Verify deterministic regression
        run: npm test -- --run test/transforms/control-flow-flattening-regression.test.ts
      - run: npm run typecheck
      - run: npm run build
      - run: npm test -- --run
      - run: git diff --check
      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/passes/jsconfuser/cff/runtime213.ts src/passes/jsconfuser/cff/bodyTwice213.ts
          git commit -m "fix: trace inner CFF state per case"
          git push origin HEAD:feature/jsconfuser-cff-shared-wrapper-helpers

name: CFF tail helper refactor

on:
  push:
    branches:
      - refactor/jsconfuser-cff-trace213-v2
    paths:
      - .github/workflows/cff-tail-refactor.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/jsconfuser-cff-trace213-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - name: Centralize tailExpression
        run: |
          python - <<'PY'
          from pathlib import Path

          wrapper = Path('src/passes/jsconfuser/cff/wrapperRuntime213.ts')
          text = wrapper.read_text()
          helper = '''\nexport function tailExpression(node: t.Expression): t.Expression {\n  return node.type === "SequenceExpression" ? node.expressions.at(-1)! : node;\n}\n'''
          if 'export function tailExpression(' in text:
              raise SystemExit('tailExpression already exists in wrapper runtime')
          wrapper.write_text(text.rstrip() + '\n' + helper)

          local = '''function tailExpression(node: t.Expression): t.Expression {\n  return node.type === "SequenceExpression" ? node.expressions.at(-1)! : node;\n}\n\n'''
          for name in ['body213.ts', 'bodyTwice213.ts', 'bodyScenario213.ts']:
              path = Path('src/passes/jsconfuser/cff') / name
              source = path.read_text()
              if source.count(local) != 1:
                  raise SystemExit(f'{name}: expected exactly one local tailExpression')
              source = source.replace(local, '', 1)
              marker = '  traceNestedStateInvocation,\n'
              if source.count(marker) != 1:
                  raise SystemExit(f'{name}: expected traceNestedStateInvocation import marker')
              source = source.replace(marker, marker + '  tailExpression,\n', 1)
              path.write_text(source)
          PY
      - run: npm run typecheck
      - run: npm run build
      - run: npm test -- --run
      - run: git diff --check
      - name: Commit verified refactor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm .github/workflows/cff-tail-refactor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/passes/jsconfuser/cff test/transforms/cff-trace213-architecture.test.ts .github/workflows/cff-tail-refactor.yml
          git commit -m "refactor: centralize CFF tail expression helper"
          git push origin HEAD:refactor/jsconfuser-cff-trace213-v2

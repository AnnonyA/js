name: Refactor CFF 2.1.3 runtime

on:
  push:
    branches:
      - refactor/jsconfuser-cff-runtime213
    paths:
      - .github/workflows/refactor-cff-runtime213.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/jsconfuser-cff-runtime213
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - name: Extract shared runtime
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from "node:fs";
          import { parse } from "@babel/parser";

          const dir = "src/passes/jsconfuser/cff";
          const canonicalPath = `${dir}/body213.ts`;
          const canonical = readFileSync(canonicalPath, "utf8");

          function parseTs(text) {
            return parse(text, {
              sourceType: "module",
              plugins: ["typescript"],
            });
          }

          function sourceFunction(text, name) {
            const ast = parseTs(text);
            const node = ast.program.body.find(
              (item) => item.type === "FunctionDeclaration" && item.id?.name === name,
            );
            if (!node || typeof node.start !== "number" || typeof node.end !== "number") {
              throw new Error(`Missing canonical function ${name}`);
            }
            return text.slice(node.start, node.end);
          }

          const orderedFunctions = [
            "visitNodes",
            "pathsEqual",
            "staticMemberPath",
            "stateIndex",
            "evaluateBinary",
            "evaluateOuter",
            "evaluateInner",
            "decodeXor",
            "dynamicMemberPath",
            "selectedCaseIndex",
            "applyStateAssignment",
            "applyStateExpression",
            "expandRuntimeStateArray",
            "callTargetPath",
            "recursiveHelperStates",
            "nestedStatesFromOuterTrace",
            "innerSwitchPath",
            "tailExpression",
          ];

          const exportedFunctions = new Set([
            "visitNodes",
            "pathsEqual",
            "staticMemberPath",
            "evaluateOuter",
            "evaluateInner",
            "decodeXor",
            "dynamicMemberPath",
            "selectedCaseIndex",
            "expandRuntimeStateArray",
            "callTargetPath",
            "nestedStatesFromOuterTrace",
            "innerSwitchPath",
            "tailExpression",
          ]);

          const runtimeParts = [];
          for (const name of orderedFunctions) {
            let source = sourceFunction(canonical, name);
            if (name === "callTargetPath") {
              source = source.replace("function callTargetPath(", "function callPath(");
              if (!source.includes("function callPath(")) {
                throw new Error("Failed to expose callPath");
              }
            }
            if (name === "nestedStatesFromOuterTrace") {
              source = source.replace(
                /privateScope: string,\n\): NestedStateTrace \| null \{/,
                "privateScope: string,\n  maxSteps = 32,\n): NestedStateTrace | null {",
              );
              source = source.replace("step < 40", "step < maxSteps");
              source = source.replaceAll("callTargetPath(", "callPath(");
              if (!source.includes("maxSteps = 32") || !source.includes("step < maxSteps")) {
                throw new Error("Failed to parameterize nested state trace budget");
              }
            }
            runtimeParts.push(exportedFunctions.has(name) ? `export ${source}` : source);
          }

          const runtime = `import * as t from "@babel/types";\nimport type { Cff213Model } from "./model.js";\nimport type { ExportedCffWrapperModel } from "./wrappers.js";\n\nconst UNKNOWN = Symbol("unknown");\ntype Value = number | string | boolean | null | undefined | typeof UNKNOWN;\n\nexport interface NestedStateTrace {\n  invocationStates: number[];\n  innerStates: number[];\n}\n\n${runtimeParts.join("\n\n")}\n`;
          writeFileSync(`${dir}/runtime213.ts`, runtime);

          const sharedImport = `import {\n  callPath,\n  decodeXor,\n  dynamicMemberPath,\n  evaluateInner,\n  evaluateOuter,\n  expandRuntimeStateArray,\n  innerSwitchPath,\n  nestedStatesFromOuterTrace,\n  pathsEqual,\n  selectedCaseIndex,\n  staticMemberPath,\n  tailExpression,\n  visitNodes,\n} from "./runtime213.js";\n`;

          function stripRuntime(path, extraFunctionNames = []) {
            let text = readFileSync(path, "utf8");
            const removeNames = new Set([
              "visitNodes",
              "pathsEqual",
              "staticMemberPath",
              "stateIndex",
              "evaluateBinary",
              "evaluateOuter",
              "evaluateInner",
              "decodeXor",
              "dynamicMemberPath",
              "selectedCaseIndex",
              "applyStateAssignment",
              "applyStateExpression",
              "expandRuntimeStateArray",
              "recursiveHelperStates",
              "nestedStatesFromOuterTrace",
              "innerSwitchPath",
              "tailExpression",
              ...extraFunctionNames,
            ]);
            const ast = parseTs(text);
            const spans = [];
            for (const node of ast.program.body) {
              let remove = false;
              if (node.type === "FunctionDeclaration" && node.id?.name && removeNames.has(node.id.name)) {
                remove = true;
              } else if (
                node.type === "VariableDeclaration" &&
                node.declarations.some((declaration) => declaration.id.type === "Identifier" && declaration.id.name === "UNKNOWN")
              ) {
                remove = true;
              } else if (node.type === "TSTypeAliasDeclaration" && node.id.name === "Value") {
                remove = true;
              } else if (node.type === "TSInterfaceDeclaration" && node.id.name === "NestedStateTrace") {
                remove = true;
              }
              if (remove && typeof node.start === "number" && typeof node.end === "number") {
                let end = node.end;
                while (end < text.length && (text[end] === "\n" || text[end] === "\r")) end += 1;
                spans.push([node.start, end]);
              }
            }
            spans.sort((a, b) => b[0] - a[0]);
            for (const [start, end] of spans) text = text.slice(0, start) + text.slice(end);
            if (!text.includes('from "./runtime213.js"')) text = sharedImport + text;
            if (path.endsWith("body213.ts")) {
              text = text.replace(
                "nestedStatesFromOuterTrace(model, wrapper, privateScope);",
                "nestedStatesFromOuterTrace(model, wrapper, privateScope, 40);",
              );
            }
            for (const name of ["UNKNOWN", "Value", "NestedStateTrace"]) {
              if (new RegExp(`\\b${name}\\b`).test(text.replace(sharedImport, ""))) {
                throw new Error(`${path} still references removed ${name}`);
              }
            }
            writeFileSync(path, text);
          }

          stripRuntime(`${dir}/body213.ts`, ["callTargetPath"]);
          stripRuntime(`${dir}/bodyTwice213.ts`, ["callPath"]);
          stripRuntime(`${dir}/bodyScenario213.ts`, ["callPath"]);
          JS
      - name: Verify refactor
        run: |
          npm run typecheck
          npm run build
          npm test -- --run
          git diff --check
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/passes/jsconfuser/cff/runtime213.ts src/passes/jsconfuser/cff/body213.ts src/passes/jsconfuser/cff/bodyTwice213.ts src/passes/jsconfuser/cff/bodyScenario213.ts
          git commit -m "refactor: share 2.1.3 CFF runtime"
          git push origin HEAD:refactor/jsconfuser-cff-runtime213
